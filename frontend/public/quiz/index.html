,"answer":["C"],"options":[{"k":"A","t":"表扬激励"},{"k":"B","t":"宣传鼓动"},{"k":"C","t":"竞赛评比"},{"k":"D","t":"以点带面法"}]},{"id":"ddw-2026-049","n":49,"kind":"choice","stem":"____是少先队的生命，没有它就谈不上少先队组织。","sort":48,"answer":["B"],"options":[{"k":"A","t":"少先队礼仪"},{"k":"B","t":"少先队活动"},{"k":"C","t":"少先队队会"},{"k":"D","t":"少先队队旗"}]},{"id":"ddw-2026-050","n":50,"kind":"choice","stem":"少先队活动按时间分，可分为假期活动和____。","sort":49,"answer":["D"],"options":[{"k":"A","t":"主题活动"},{"k":"B","t":"常规活动"},{"k":"C","t":"队务活动"},{"k":"D","t":"平时活动"}]},{"id":"ddw-2026-051","n":51,"kind":"choice","stem":"队会从____分，可分为竞赛式队会、讨论式队会、联谊式队会、论辩式队会、报告式队会。","sort":50,"answer":["B"],"options":[{"k":"A","t":"内容"},{"k":"B","t":"形式"},{"k":"C","t":"主题"},{"k":"D","t":"时间"}]},{"id":"ddw-2026-052","n":52,"kind":"multi","stem":"在中国少年先锋队建队 70 周年之际，中共中央总书记、国家主席、中央军委主席习近平发来贺信，代表党中央向全国亿万少先队员，向为党的少年儿童事业辛勤工作的广大少先队辅导员和少先队工作者，表示热烈的祝贺和诚挚的问候。习近平在贺信中指出，70 年来，在党的领导下，少先队坚持____相统一，为党和人民事业薪火相传作出重要贡献。","sort":51,"answer":["A","B","C"],"options":[{"k":"A","t":"组织教育"},{"k":"B","t":"自主教育"},{"k":"C","t":"实践教育"}]},{"id":"ddw-2026-053","n":53,"kind":"choice","stem":"队会中呼号的口号是____","sort":52,"answer":["C"],"options":[{"k":"A","t":"时刻准备着！"},{"k":"B","t":"为人民服务！"},{"k":"C","t":"准备着：为共产主义事业而奋斗！"},{"k":"D","t":"我们是共产主义接班人！"}]},{"id":"ddw-2026-054","n":54,"kind":"choice","stem":"“中国少年儿童队”改名为“中国少年先锋队”是在____年。","sort":53,"answer":["C"],"options":[{"k":"A","t":"1949"},{"k":"B","t":"1951"},{"k":"C","t":"1953"},{"k":"D","t":"1955"}]},{"id":"ddw-2026-055","n":55,"kind":"choice","stem":"五角星加火炬和写有“中国少先队”的____色绶带组成我们的队徽。","sort":54,"answer":["A"],"options":[{"k":"A","t":"红"},{"k":"B","t":"紫红"},{"k":"C","t":"粉红"}]},{"id":"ddw-2026-056","n":56,"kind":"blank","stem":"少先队代表大会____，是少先队大队或大队以上组织和机构召开，由____为主体参加的会议。少代会是同级队组织的最高权力机构，它有商讨、决定一个时期队的重大事务，选举产生队工作领导委员会的权力。","sort":55,"answer":["简称少代会","队员代表"]},{"id":"ddw-2026-057","n":57,"kind":"qa","stem":"队旗的寓意是什么？","sort":56,"answer":["队旗寓意着：在中国共产党的领导下，向着光明的未来前进。"]},{"id":"ddw-2026-058","n":58,"kind":"blank","stem":"全国少代会每____年召开一次，省____、市____少代会每五年召开一次，县____少代会每____年召开一次，学校少代会每学年召开一次。","sort":57,"answer":["五","自治区、直辖市","地、州、盟","市、区、旗","三"]},{"id":"ddw-2026-059","n":59,"kind":"qa","stem":"红领巾的规格要求是什么？","sort":58,"answer":["红领巾是等腰三角形，它的底长为 100 厘米，腰长为 60厘米。"]},{"id":"ddw-2026-060","n":60,"kind":"qa","stem":"少先队的最高领导机构是什么？","sort":59,"answer":["少先队全国工作委员会。"]},{"id":"ddw-2026-061","n":61,"kind":"qa","stem":"少先队设有哪几个基层组织？","sort":60,"answer":["少先队可以以学校为单位建立大队，大队下分中队，中队下设小队。"]},{"id":"ddw-2026-062","n":62,"kind":"qa","stem":"在全国第七次少先队代表开幕式时，习近平总书记寄语全国各族少年儿童时，提出了“三个学习”的要求，是指什么？","sort":61,"answer":["从小学习做人、从小学习立志、从小学习创造。"]},{"id":"ddw-2026-063","n":63,"kind":"qa","stem":"少先队的五有指的是哪五有？","sort":62,"answer":["有组织、有队伍、有活动、有阵地、有制度。"]}]}]}</script>
<script>
(function(){
"use strict";

var SEED = JSON.parse(document.getElementById('quizSeed').textContent);
var BANK = SEED.banks[0];
var QS = BANK.questions;
var KEY = 'quiz.' + BANK.id;
var KIND = {choice:'单选', multi:'多选', blank:'填空', qa:'问答'};

/* ---------- 同源后端上报（file:// 环境不触发） ---------- */
var API_ENABLED = location.protocol !== 'file:' && location.hostname !== '';
var API_SID = null;
function api(method, path, body){
  if(!API_ENABLED) return Promise.resolve(null);
  return fetch(path, {method:method, headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined})
    .then(function(r){ if(!r.ok) throw new Error(''+r.status); return r.json(); })
    .catch(function(e){ console.log('quiz api err', path, e); return null; });
}
function apiStart(mode, qids){
  return api('POST','/api/quiz/start',{bank_id:BANK.id, mode:mode, qids:qids})
    .then(function(res){ if(res && res.session){ API_SID = res.session.id; } });
}
function apiAttempt(qid, answer, correct){
  if(!API_SID) return Promise.resolve(null);
  return api('POST','/api/quiz/attempt',{session_id:API_SID, question_id:qid, answer:answer||'', correct:correct});
}
function apiComplete(){
  if(!API_SID) return Promise.resolve(null);
  var sid = API_SID;
  return api('POST','/api/quiz/complete',{session_id:sid}).then(function(){
    if(API_SID === sid) API_SID = null;
  });
}


var STUDY_QIDS = [];
var STUDY_MODE = false;
var STUDY_START = null;
function noteStudy(id){
  if(!id) return;
  if(STUDY_QIDS.indexOf(id) < 0) STUDY_QIDS.push(id);
  if(STUDY_QIDS.length === 1) ensureStudySession();
}
function ensureStudySession(){
  if(API_SID || !API_ENABLED || expired()) return Promise.resolve(null);
  if(STUDY_START) return STUDY_START;
  STUDY_MODE = true;
  STUDY_START = apiStart('study', STUDY_QIDS.slice()).then(function(){ STUDY_START = null; });
  return STUDY_START;
}
function finishStudySession(){
  var start = STUDY_START || Promise.resolve(null);
  return start.then(function(){
    if(!STUDY_MODE || !API_SID) return null;
    STUDY_MODE = false;
    return apiComplete();
  });
}


function goHome(ev){
  if(ev) ev.preventDefault();
  finishStudySession().then(function(){ location.href = '/'; });
  return false;
}

var S = {v:1, examDate:null, q:{}, log:[]};
try{
  var raw = localStorage.getItem(KEY);
  if(raw){ var o = JSON.parse(raw); S.v=o.v||1; S.examDate=o.examDate||null; S.q=o.q||{}; S.log=o.log||[]; }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function st(id){ if(!S.q[id]) S.q[id]={seen:0,known:null,right:0,wrong:0}; return S.q[id]; }

/* 掌握 = 明确标了「记住了」，或者在练习/考试里连对 2 次。
   答错会把 right 清零并把 known 置 false，所以掌握会掉下来。 */
function isKnown(id){ var s=S.q[id]; return !!(s && (s.known===true || s.right>=2)); }
function isNew(id){ var s=S.q[id]; return !(s && s.seen>0); }
function isWeak(id){ return !isKnown(id) && !isNew(id); }
function isWrong(id){ return !!(S.q[id] && S.q[id].wrong>0); }

function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function examDate(){ return S.examDate || BANK.end_at || null; }
var FORCE = false;
function expired(){ if(FORCE) return false; var e=examDate(); return !!(e && todayStr() > e); }
function daysLeft(){
  var e=examDate(); if(!e) return null;
  var a=new Date(todayStr()+'T00:00:00'), b=new Date(e+'T00:00:00');
  return Math.round((b-a)/86400000);
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function blanksOf(s){ return (s.match(/____/g)||[]).length; }
function stemHtml(qq, filled){
  var s = esc(qq.stem);
  if(filled && qq.answer.length && qq.answer.length === blanksOf(qq.stem)){
    var i = 0;
    s = s.replace(/____/g, function(){ return '<span class="filled">'+esc(qq.answer[i++])+'</span>'; });
  }else{
    s = s.replace(/____/g, '<span class="blank"></span>');
  }
  return s;
}
function ansText(qq){
  if(qq.kind==='choice' || qq.kind==='multi'){
    var m={}; (qq.options||[]).forEach(function(o){ m[o.k]=o.t; });
    return qq.answer.map(function(k){ return k + (m[k] ? ' ' + m[k] : ''); }).join('　');
  }
  return qq.answer.join('　／　');
}
function canReadThrough(qq){ return blanksOf(qq.stem) > 0 && blanksOf(qq.stem) === qq.answer.length; }
function stats(){
  var k=0,w=0,n=0;
  QS.forEach(function(x){ if(isKnown(x.id))k++; else if(isNew(x.id))n++; else w++; });
  return {k:k,w:w,n:n,total:QS.length};
}
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function findQ(id){ for(var i=0;i<QS.length;i++) if(QS[i].id===id) return QS[i]; return null; }

function logIt(qq, ok, where){
  S.log.unshift({t:Date.now(), id:qq.id, ok:!!ok, where:where});
  S.log = S.log.slice(0,300);
}
function mark(qq, known){
  var s = st(qq.id); s.seen++;
  s.known = !!known;
  if(known){ s.wrong = 0; } else { s.right = 0; }
  logIt(qq, known, '看题'); save();
}
function record(qq, ok, where){
  var s = st(qq.id); s.seen++;
  if(ok){ s.right++; } else { s.wrong++; s.right = 0; s.known = false; }
  logIt(qq, ok, where); save();
}

function paintHead(){
  var s = stats();
  document.getElementById('stat').innerHTML =
    '<span class="k">已掌握 <b>'+s.k+'</b></span>' +
    '<span class="w">还不熟 <b>'+s.w+'</b></span>' +
    '<span>没看过 <b>'+s.n+'</b></span>';
  document.getElementById('barfill').style.width = (s.total ? Math.round(s.k/s.total*100) : 0) + '%';
  var d = daysLeft(), el = document.getElementById('countdown');
  if(d===null){ el.textContent = ''; }
  else if(d>0){ el.textContent = '距离笔试还有 '+d+' 天'; }
  else if(d===0){ el.textContent = '今天就是笔试'; }
  else { el.textContent = '笔试已过 ' + (-d) + ' 天'; }
}

function endedHtml(){
  return '<div class="card empty">这场考试已经结束了。' +
    '<div class="hint">下线日期是 '+esc(examDate())+'。家长长按标题可以改日期或清掉日期。</div></div>' +
    '<div class="row"><button class="wide" onclick="forceStudy()">还是想再看看</button></div>';
}
function forceStudy(){ FORCE = true; paintHead(); go(MODE); }

/* ---------------- 看题 ---------------- */
var ST = {i:0, order:null, showAns:false, showGrid:false};
function studyOrder(){
  var weak=[], fresh=[], done=[];
  QS.forEach(function(x){ if(isKnown(x.id)) done.push(x); else if(isNew(x.id)) fresh.push(x); else weak.push(x); });
  return weak.concat(fresh, done);
}
function renderStudy(){
  var main = document.getElementById('main');
  if(expired()){ main.innerHTML = endedHtml(); return; }
  if(!ST.order || ST.order.length !== QS.length) ST.order = studyOrder();
  if(ST.i >= ST.order.length) ST.i = 0;
  var qq = ST.order[ST.i];
  var h = '<div class="card">';
  h += '<div class="qhead"><span>第 '+qq.n+' 题　<small>看题 '+(ST.i+1)+'/'+ST.order.length+'</small></span><span class="tag">'+KIND[qq.kind]+'</span></div>';
  h += '<div class="stem">'+stemHtml(qq, ST.showAns)+'</div>';
  if(qq.options && qq.options.length){
    h += '<ul class="opts">';
    qq.options.forEach(function(o){ h += '<li><span class="k">'+o.k+'</span><span>'+esc(o.t)+'</span></li>'; });
    h += '</ul>';
  }
  if(ST.showAns){
    h += '<div class="ans"><span class="lbl">答案</span>'+esc(ansText(qq));
    if(canReadThrough(qq)) h += '<div class="read">连起来读：'+stemHtml(qq, true)+'</div>';
    h += '</div>';
    h += '<div class="row"><button class="ok" onclick="markCur(true)">记住了</button>' +
         '<button class="no" onclick="markCur(false)">还不熟</button></div>';
  }else{
    h += '<div class="row"><button class="primary wide" onclick="reveal()">看答案</button></div>';
  }
  h += '</div>';
  h += '<div class="nav"><button onclick="step(-1)">上一题</button>' +
       '<span class="pos">'+(ST.i+1)+' / '+ST.order.length+'</span>' +
       '<button onclick="step(1)">下一题</button></div>';
  h += '<div class="row"><button class="ghost" onclick="toggleGrid()">'+(ST.showGrid?'收起题目一览':'题目一览')+'</button></div>';
  if(ST.showGrid){
    h += '<div class="grid">';
    ST.order.forEach(function(x, idx){
      var cls = isKnown(x.id) ? 'k' : (isNew(x.id) ? '' : 'w');
      if(idx===ST.i) cls += ' cur';
      h += '<b class="'+cls+'" onclick="jump('+idx+')">'+x.n+'</b>';
    });
    h += '</div><div class="hint">绿＝已掌握　红＝还不熟　灰＝没看过</div>';
  }
  main.innerHTML = h;
  if (qq) noteStudy(qq.id);
}
function reveal(){
  if (ST.order && ST.order[ST.i]) noteStudy(ST.order[ST.i].id);
  ST.showAns = true; renderStudy();
}

function step(d){
  ST.i = (ST.i + d + ST.order.length) % ST.order.length; ST.showAns = false; renderStudy();
  if(ST.order && ST.order[ST.i]) noteStudy(ST.order[ST.i].id);
}
function jump(i){
  ST.i = i; ST.showAns = false; renderStudy();
  if(ST.order && ST.order[ST.i]) noteStudy(ST.order[ST.i].id);
}
function toggleGrid(){ ST.showGrid = !ST.showGrid; renderStudy(); }
function markCur(known){
  var qq = ST.order[ST.i];
  mark(qq, known);
  noteStudy(qq.id);
  ST.showAns = false;
  paintHead();
  step(1);
}

/* ---------------- 练习 ---------------- */
var PR = {items:[], i:0, right:0, state:'ask', picked:[], lastOk:null, done:false, wrongList:[]};
function startPractice(n){
  var weak  = shuffle(QS.filter(function(x){ return isWeak(x.id); }));
  var fresh = shuffle(QS.filter(function(x){ return isNew(x.id); }));
  var rest  = shuffle(QS.filter(function(x){ return isKnown(x.id); }));
  PR = {items: weak.concat(fresh, rest).slice(0, n), i:0, right:0, state:'ask',
        picked:[], lastOk:null, done:false, wrongList:[]};
  finishStudySession().then(function(){
    apiStart('practice', PR.items.map(function(x){ return x.id; }));
  });
  renderPractice();
}
function renderPractice(){
  var main = document.getElementById('main');
  if(expired()){ main.innerHTML = endedHtml(); return; }
  if(!PR.items.length){ main.innerHTML = '<div class="card empty">这里还没有题。</div>'; return; }
  if(PR.done){
    var pct = Math.round(PR.right / PR.items.length * 100);
    var h = '<div class="card"><div class="mid">本次练习</div><div class="big">'+PR.right+' / '+PR.items.length+'</div>' +
      '<div class="mid">正确率 '+pct+'%</div>';
    if(PR.wrongList.length){
      h += '<div class="sec">错的题（'+PR.wrongList.length+' 道）</div><div class="list">';
      PR.wrongList.forEach(function(x){
        h += '<div class="it">第 '+x.n+' 题　<small>'+esc(x.stem)+'</small><div class="a">'+esc(ansText(x))+'</div></div>';
      });
      h += '</div>';
    }else{
      h += '<div class="hint" style="text-align:center">全对，厉害。</div>';
    }
    h += '<div class="row"><button class="primary wide" onclick="startPractice(10)">再来 10 题</button></div></div>';
    main.innerHTML = h; return;
  }
  var qq = PR.items[PR.i];
  var showAns = (PR.state==='self' || PR.state==='done');
  var h = '<div class="card">';
  h += '<div class="qhead"><span>第 '+(PR.i+1)+' / '+PR.items.length+' 题　<small>原题 '+qq.n+'</small></span><span class="tag">'+KIND[qq.kind]+'</span></div>';
  h += '<div class="stem">'+stemHtml(qq, showAns)+'</div>';
  if(qq.options && qq.options.length){
    h += '<ul class="opts">';
    qq.options.forEach(function(o){
      var cls = '';
      if(PR.state==='ask'){ if(PR.picked.indexOf(o.k)>=0) cls='pick'; }
      else if(qq.answer.indexOf(o.k)>=0){ cls='ok'; }
      else if(PR.picked.indexOf(o.k)>=0){ cls='no'; }
      h += '<li class="'+cls+'" onclick="pickOpt(\''+o.k+'\')"><span class="k">'+o.k+'</span><span>'+esc(o.t)+'</span></li>';
    });
    h += '</ul>';
  }
  if(PR.state==='ask'){
    if(qq.kind==='choice' || qq.kind==='multi'){
      var lbl = qq.kind==='multi' ? '确定（可多选）' : '确定';
      h += '<div class="row"><button class="primary wide" onclick="submitOpt()">'+lbl+'</button></div>';
    }else{
      h += '<div class="row"><button class="primary wide" onclick="selfCheck()">看答案，自己判</button></div>';
    }
  }else if(PR.state==='self'){
    h += '<div class="ans"><span class="lbl">答案</span>'+esc(ansText(qq));
    if(canReadThrough(qq)) h += '<div class="read">连起来读：'+stemHtml(qq,true)+'</div>';
    h += '</div>';
    h += '<div class="row"><button class="ok" onclick="selfJudge(true)">答对了</button>' +
         '<button class="no" onclick="selfJudge(false)">没答对</button></div>';
  }else{
    h += '<div class="fb '+(PR.lastOk?'ok':'no')+'">'+(PR.lastOk?'答对了':'答错了，看看正确答案')+'</div>';
    h += '<div class="ans"><span class="lbl">答案</span>'+esc(ansText(qq))+'</div>';
    h += '<div class="row"><button class="primary wide" onclick="nextPractice()">下一题</button></div>';
  }
  h += '</div>';
  main.innerHTML = h;
}
function pickOpt(k){
  if(PR.state!=='ask') return;
  var qq = PR.items[PR.i];
  if(qq.kind==='multi'){
    var i = PR.picked.indexOf(k);
    if(i>=0) PR.picked.splice(i,1); else PR.picked.push(k);
  }else{ PR.picked = [k]; }
  renderPractice();
}
function settle(ok){
  var qq = PR.items[PR.i];
  PR.lastOk = ok; PR.state = 'done';
  if(ok){ PR.right++; } else { PR.wrongList.push(qq); }
  record(qq, ok, '练习');
  var ans = (qq.kind==='choice'||qq.kind==='multi') ? PR.picked.slice().sort().join(',') : '';
  apiAttempt(qq.id, ans, ok);
  paintHead(); renderPractice();
}
function submitOpt(){
  if(!PR.picked.length) return;
  var qq = PR.items[PR.i];
  settle(PR.picked.slice().sort().join('') === qq.answer.slice().sort().join(''));
}
function selfCheck(){ PR.state='self'; renderPractice(); }
function selfJudge(ok){ settle(ok); }
function nextPractice(){
  PR.i++; PR.picked=[]; PR.state='ask'; PR.lastOk=null;
  if(PR.i >= PR.items.length){ PR.done = true; apiComplete(); }
  renderPractice();
}

/* ---------------- 模拟考 ---------------- */
var EX = {items:[], i:0, picked:[], done:false, right:0, auto:0, manual:[], wrongList:[], skipped:0};
function startExam(){
  EX = {items: shuffle(QS).slice(0, Math.min(20, QS.length)), i:0, picked:[],
        done:false, right:0, auto:0, manual:[], wrongList:[], skipped:0};
  finishStudySession().then(function(){
    apiStart('exam', EX.items.map(function(x){ return x.id; }));
  });
  renderExam();
}
function renderExam(){
  var main = document.getElementById('main');
  if(expired()){ main.innerHTML = endedHtml(); return; }
  if(!EX.items.length){
    main.innerHTML = '<div class="card"><div class="mid">模拟考</div>' +
      '<div class="hint" style="text-align:center">抽 20 道题。中途不给答案，交卷后统一看分。<br>' +
      '选择题自动判，填空和问答交卷后列出来自己对。</div>' +
      '<div class="row"><button class="primary wide" onclick="startExam()">开始模拟考</button></div></div>';
    return;
  }
  if(EX.done){
    var h = '<div class="card"><div class="mid">模拟考成绩</div>' +
      '<div class="big">'+(EX.auto ? EX.right+' / '+EX.auto : '—')+'</div>' +
      '<div class="mid">选择题'+(EX.auto ? '得分 '+Math.round(EX.right/EX.auto*100)+' 分' : '本次没有')+
      (EX.skipped ? '　·　没作答 '+EX.skipped+' 题' : '')+'</div>';
    if(EX.wrongList.length){
      h += '<div class="sec">选错的题（'+EX.wrongList.length+' 道）</div><div class="list">';
      EX.wrongList.forEach(function(x){
        h += '<div class="it">第 '+x.n+' 题　<small>'+esc(x.stem)+'</small><div class="a">'+esc(ansText(x))+'</div></div>';
      });
      h += '</div>';
    }
    if(EX.manual.length){
      h += '<div class="sec">这几道填空/问答，自己对答案</div><div class="list">';
      EX.manual.forEach(function(x){
        h += '<div class="it">第 '+x.n+' 题　<small>'+esc(x.stem)+'</small><div class="a">'+esc(ansText(x))+'</div></div>';
      });
      h += '</div>';
    }
    h += '<div class="row"><button class="primary wide" onclick="startExam()">再考一次</button></div></div>';
    main.innerHTML = h; return;
  }
  var qq = EX.items[EX.i];
  var h = '<div class="card">';
  h += '<div class="qhead"><span>第 '+(EX.i+1)+' / '+EX.items.length+' 题</span><span class="tag">'+KIND[qq.kind]+'</span></div>';
  h += '<div class="stem">'+stemHtml(qq, false)+'</div>';
  if(qq.options && qq.options.length){
    h += '<ul class="opts">';
    qq.options.forEach(function(o){
      h += '<li class="'+(EX.picked.indexOf(o.k)>=0?'pick':'')+'" onclick="examPick(\''+o.k+'\')"><span class="k">'+o.k+'</span><span>'+esc(o.t)+'</span></li>';
    });
    h += '</ul>';
  }else{
    h += '<div class="hint">这题在纸上写，交卷后一起对答案。</div>';
  }
  h += '<div class="row"><button class="primary wide" onclick="examNext()">' +
       (EX.i===EX.items.length-1 ? '交卷' : '下一题') + '</button></div>';
  h += '</div>';
  main.innerHTML = h;
}
function examPick(k){
  var qq = EX.items[EX.i];
  if(qq.kind==='multi'){ var i=EX.picked.indexOf(k); if(i>=0) EX.picked.splice(i,1); else EX.picked.push(k); }
  else { EX.picked = [k]; }
  renderExam();
}
function gradeExam(){
  var qq = EX.items[EX.i];
  if(qq.kind==='choice' || qq.kind==='multi'){
    EX.auto++;
    if(!EX.picked.length){
      EX.skipped++; EX.wrongList.push(qq); record(qq, false, '模拟考');
      apiAttempt(qq.id, '', false);
    }else{
      var ok = EX.picked.slice().sort().join('') === qq.answer.slice().sort().join('');
      if(ok){ EX.right++; } else { EX.wrongList.push(qq); }
      record(qq, ok, '模拟考');
      apiAttempt(qq.id, EX.picked.slice().sort().join(','), ok);
    }
  }else{
    EX.manual.push(qq);
    apiAttempt(qq.id, '', null);
  }
  paintHead();
}
function examNext(){
  gradeExam(); EX.picked = []; EX.i++;
  if(EX.i >= EX.items.length){ EX.done = true; apiComplete(); }
  renderExam();
}

/* ---------------- 家长设置 ---------------- */
function openSheet(){
  var e = examDate() || '';
  var wrong = QS.filter(function(x){ return isWrong(x.id); });
  var s = stats();
  var h = '<h2>家长设置</h2><div class="hint">长按标题打开，孩子平时碰不到。</div>';
  h += '<label>下线日期（过了这天，孩子端显示「这场考试已经结束」）</label>';
  h += '<input type="date" id="examDateInput" value="'+esc(e)+'">';
  h += '<div class="row"><button class="primary" onclick="saveDate()">保存</button>' +
       '<button class="ghost" onclick="clearDate()">清除</button></div>';
  h += BANK.end_at
    ? '<div class="hint">题库自带默认日期 '+esc(BANK.end_at)+'，这里填的会覆盖它。</div>'
    : '<div class="hint">题库没设默认日期，所以现在不会自动下线。填一个日期就行。</div>';

  h += '<div class="sec">孩子的情况</div><div class="list">';
  h += '<div class="it">已掌握 '+s.k+' 题　·　还不熟 '+s.w+' 题　·　没看过 '+s.n+' 题</div>';
  h += '<div class="it">累计答错过的题：'+wrong.length+' 道</div>';
  h += '</div>';

  h += '<div class="sec">错题清单（抽查用）</div>';
  if(!wrong.length){ h += '<div class="hint">还没有答错的题。</div>'; }
  else{
    h += '<div class="list">';
    wrong.slice(0,40).forEach(function(x){
      h += '<div class="it">第 '+x.n+' 题　<small>错 '+S.q[x.id].wrong+' 次</small>' +
           '<div>'+esc(x.stem)+'</div><div class="a">'+esc(ansText(x))+'</div></div>';
    });
    h += '</div>';
    if(wrong.length>40) h += '<div class="hint">只显示前 40 道。</div>';
  }

  h += '<div class="sec">最近记录</div>';
  if(!S.log.length){ h += '<div class="hint">还没有记录。</div>'; }
  else{
    h += '<div class="list">';
    S.log.slice(0,20).forEach(function(x){
      var qq = findQ(x.id), d = new Date(x.t);
      var ts = (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      h += '<div class="it"><small>'+ts+'　'+esc(x.where)+'</small>　第 '+(qq?qq.n:'?')+' 题　' +
           '<b style="color:'+(x.ok?'var(--ok)':'var(--no)')+'">'+(x.ok?'对':'错')+'</b></div>';
    });
    h += '</div>';
  }

  h += '<div class="sec">给家长看的汇总</div>';
  h += '<pre class="copy" id="copyBox">'+esc(reportText())+'</pre>';
  h += '<div class="row"><button class="primary wide" onclick="copyReport()">复制这段发给家长</button></div>';
  h += '<div class="row"><button class="ghost wide" onclick="resetAll()">清空全部进度</button></div>';
  h += '<div class="row"><button class="ghost wide" onclick="closeSheet()">关闭</button></div>';
  h += '<div class="hint" style="text-align:center;margin-top:16px">题库版本 '+esc(SEED.curriculum_ver)+'　·　共 '+QS.length+' 题</div>';
  document.getElementById('sheetIn').innerHTML = h;
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }
function saveDate(){ S.examDate = document.getElementById('examDateInput').value || null; save(); paintHead(); go(MODE); openSheet(); }
function clearDate(){ S.examDate = null; save(); paintHead(); go(MODE); openSheet(); }
function resetAll(){
  if(!confirm('清空全部练习进度和记录？这个不能撤销。')) return;
  S.q = {}; S.log = []; save(); ST.i = 0; ST.order = null; paintHead(); go(MODE); openSheet();
}
function reportText(){
  var s = stats(), e = examDate(), lines = [];
  lines.push('大队委竞选笔试复习 · 进度');
  lines.push('日期：'+todayStr() + (e ? '（下线日期 '+e+'）' : ''));
  lines.push('已掌握 '+s.k+' / '+s.total+'，还不熟 '+s.w+'，没看过 '+s.n);
  var wrong = QS.filter(function(x){ return isWrong(x.id); });
  lines.push('');
  if(wrong.length){
    lines.push('答错过的题：');
    wrong.forEach(function(x){ lines.push('  第'+x.n+'题 '+x.stem+'　答案：'+ansText(x)); });
  }else{
    lines.push('目前没有答错的题。');
  }
  return lines.join('\n');
}
function doCopy(t, done, fail){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done, function(){ legacyCopy(t, done, fail); });
  }else{
    legacyCopy(t, done, fail);
  }
}
function legacyCopy(t, done, fail){
  var ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.top='-1000px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ fail(); }
  document.body.removeChild(ta);
}
function copyReport(){
  doCopy(reportText(), function(){ alert('已经复制好了'); },
         function(){ alert('复制失败，可以手动选中上面那段。'); });
}
function bindHold(el, fn){
  var timer = null;
  var start = function(){ if(timer) clearTimeout(timer); timer = setTimeout(fn, 1200); };
  var stop  = function(){ if(timer){ clearTimeout(timer); timer = null; } };
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchend', stop);
  el.addEventListener('touchmove', stop);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', stop);
  el.addEventListener('mouseleave', stop);
}

/* ---------------- 路由 ---------------- */
var MODE = 'study';
function go(m){
  MODE = m;
  ['study','practice','exam'].forEach(function(k){
    document.getElementById('tab-'+k).classList.toggle('on', k===m);
  });
  if(m==='study'){ renderStudy(); }
  else if(m==='practice'){
    if(!PR.items.length || PR.done){ startPractice(10); }
    else { finishStudySession().then(function(){ renderPractice(); }); }
  }
  else {
    finishStudySession().then(function(){ renderExam(); });
  }

}


window.go = go; window.reveal = reveal; window.step = step; window.jump = jump;
window.toggleGrid = toggleGrid; window.markCur = markCur; window.forceStudy = forceStudy;
window.pickOpt = pickOpt; window.submitOpt = submitOpt; window.selfCheck = selfCheck;
window.selfJudge = selfJudge; window.nextPractice = nextPractice; window.startPractice = startPractice;
window.startExam = startExam; window.examPick = examPick; window.examNext = examNext;
window.saveDate = saveDate; window.clearDate = clearDate; window.resetAll = resetAll;
window.closeSheet = closeSheet; window.copyReport = copyReport; window.openSheet = openSheet;

window.goHome = goHome;
document.addEventListener('visibilitychange', function(){ if(document.hidden) finishStudySession(); });
window.addEventListener('pagehide', function(){ finishStudySession(); });
bindHold(document.getElementById('title'), openSheet);
paintHead();
go('study');
})();
