<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2fa6de" />
  <title>英语复习</title>
  <style>
    :root {
      --ink: #1f3b55; --ink-2: #557089; --ink-3: #8ba0b3; --line: #dbe6ef;
      --surface: #fff; --surface-2: #f2f7fb; --brand: #2fa6de; --brand-deep: #1c6f96;
      --ok: #2e9e63; --ok-bg: #e6f6ed; --warm: #fff4e0; --warm-2: #fffaf0; --accent: #f5a524;
      --radius-lg: 18px; --radius-md: 12px; --radius-pill: 999px; --shadow: 0 6px 18px rgba(31,59,85,.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; background: var(--surface-2); color: var(--ink);
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 14px 14px calc(18px + env(safe-area-inset-bottom));
    }
    .wrap { max-width: 620px; margin: 0 auto; }
    .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .bar a { color: var(--ink-2); text-decoration: none; font-weight: 700; font-size: 14px; }
    .bar h1 { flex: 1; margin: 0; font-size: 18px; }
    .bar .stat { font-size: 13px; color: var(--ink-2); font-weight: 700; }
    .track { height: 10px; border-radius: var(--radius-pill); background: #e4eef5; overflow: hidden; }
    .track i { display: block; height: 100%; background: linear-gradient(90deg, #9ad7f2, var(--brand)); transition: width .18s ease; }
    .goal { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
    .goal .gtrack { flex: 1; height: 8px; border-radius: var(--radius-pill); background: #e4eef5; overflow: hidden; }
    .goal .gtrack i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #9ad7f2, var(--brand)); transition: width .18s ease; }
    .goal.done { color: var(--ok); }
    .goal.done .gtrack i { background: var(--ok); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 18px 16px; margin-top: 14px; }
    .qhead { display: flex; justify-content: center; margin-bottom: 4px; }
    .kind { display: inline-block; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 3px 10px; font-size: 12px; font-weight: 800; color: var(--ink-2); }
    .cn { font-size: 26px; font-weight: 800; text-align: center; letter-spacing: -.01em; }
    .en { font-size: 30px; font-weight: 800; text-align: center; margin: 4px 0 2px; letter-spacing: -.01em; }
    .hint { text-align: center; color: var(--ink-3); font-size: 12px; margin: 6px 0 0; }
    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .opt { min-height: 52px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-md); padding: 12px 10px; font-size: 16px; font-weight: 800; color: var(--ink); cursor: pointer; }
    .opt.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
    .opt.no { background: #fdeeee; border-color: #e9b4b4; color: #a33; }
    .opt:disabled { cursor: default; }
    .board { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-top: 12px; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .cell { min-height: 46px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-md); padding: 12px 8px; text-align: center; font-size: 15px; font-weight: 800; color: var(--ink); cursor: pointer; word-break: break-word; }
    .cell.pick { border-color: var(--accent); background: #fff7e8; }
    .cell.done { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); opacity: .8; cursor: default; }
    .cell.bad { border-color: #e9b4b4; background: #fdeeee; color: #a33; }
    .mbar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: var(--ink-2); }
    .slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 16px 0 8px; min-height: 42px; cursor: text; }
    .slots i { width: 22px; height: 34px; border-bottom: 2px solid var(--ink-3); display: inline-flex; align-items: flex-end; justify-content: center; font-weight: 800; font-size: 21px; line-height: 1; font-style: normal; }
    .slots i.space { width: 12px; border: none; }
    .slots i.fix { border: none; align-items: center; }
    .slots i.cur { border-color: var(--accent); background: #fff4e0; border-radius: 5px 5px 0 0; }
    .slots.right i { border-color: var(--ok); color: var(--ok); }
    .slots.wrong i { border-color: var(--accent); color: #b06a00; }
    .slotwrap { position: relative; }
    /* 幽灵输入框：铺在格子上面，只当键盘通道（看不见、点不到，由点格子来定位光标）。
       铺满是为了聚焦时不会把页面滚到别处；font-size 至少 16px 免得 iOS 聚焦时缩放。 */
    .ghost { position: absolute; inset: 0; opacity: 0; pointer-events: none; border: none;
      background: none; font-size: 16px; color: transparent; }
    .slotwrap.caret-off .slots { opacity: .5; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
    button { font-family: inherit; font-size: 16px; font-weight: 800; border-radius: var(--radius-pill); padding: 12px 20px; cursor: pointer; border: 1px solid transparent; }
    .do { background: var(--brand); color: #fff; min-width: 128px; }
    .do:disabled { opacity: .5; }
    .sec { background: var(--surface); color: var(--ink-2); border-color: var(--line); }
    .big { font-size: 20px; }
    .fb { margin: 12px 0 0; text-align: center; font-weight: 800; }
    .fb.ok { color: var(--ok); }
    .fb.no { color: #b06a00; }
    .big-en { text-align: center; font-size: 30px; font-weight: 800; margin: 10px 0 2px; }
    .ipa { text-align: center; color: var(--ink-3); font-size: 13px; }
    .sum { text-align: center; }
    .sum .emoji { font-size: 40px; line-height: 1.1; }
    .sum .title { font-size: 21px; font-weight: 800; margin-top: 2px; }
    .sum .sub { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
    .sum .list { max-width: 330px; margin: 14px auto 0; text-align: left; }
    .sum .list div { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 8px 2px; border-bottom: 1px dashed var(--line); font-size: 15px; color: var(--ink-2); font-weight: 700; }
    .sum .list div:last-child { border-bottom: none; }
    .sum .list b { color: var(--ink); font-size: 17px; font-weight: 800; }
    .sum .goal-line { font-weight: 800; }
    .sum .goal-line.done { color: var(--ok); }
    .lv { text-align: center; }
    .lv .stars { font-size: 38px; letter-spacing: 6px; line-height: 1.2; }
    .lv .title { font-size: 22px; font-weight: 800; }
    .lv .sub { color: var(--ink-2); font-size: 14px; margin-top: 6px; }
    .err { margin-top: 12px; padding: 12px 14px; border: 1px solid #e9b4b4; background: #fdeeee; border-radius: var(--radius-md); }
    .err strong { display: block; margin-bottom: 4px; color: #a33; }
    .err span { color: var(--ink-2); font-size: 13px; word-break: break-all; }
    .streak { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; color: var(--ink-2); font-weight: 700; font-size: 13px; }
    .streak.on { color: #b06a00; }
    .foot { text-align: center; color: var(--ink-3); font-size: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <a href="/">← 回今天</a>
      <h1>英语复习</h1>
      <span class="stat" id="stat"></span>
    </div>
    <div class="track"><i id="progress" style="width:0%"></i></div>
    <div class="goal" id="goal" hidden>
      <span id="goal-text">今天目标 0/10</span>
      <span class="gtrack"><i id="goal-fill"></i></span>
      <span id="goal-mark"></span>
    </div>

    <div id="err" class="err" hidden>
      <strong id="err-title">加载失败</strong>
      <span id="err-body"></span>
      <div class="row" style="justify-content:flex-start">
        <button class="sec" id="err-retry" type="button">重试</button>
      </div>
    </div>

    <div class="card" id="card-loading">正在准备今天的词…</div>

    <div class="card" id="card-quiz" hidden>
      <div class="qhead"><span class="kind" id="kind"></span></div>

      <div id="q-recognize" hidden>
        <div class="en" id="rec-word"></div>
        <div class="row"><button class="sec" id="rec-hear" type="button">🔊 听发音</button></div>
        <p class="hint">选出它的意思（认一认就好）</p>
        <div class="opts" id="rec-opts"></div>
      </div>

      <div id="q-match" hidden>
        <div class="mbar"><span id="m-block"></span><span id="m-stat"></span></div>
        <div class="board">
          <div class="col" id="m-left"></div>
          <div class="col" id="m-right"></div>
        </div>
        <p class="hint">先点左边一个、再点右边一个（点左边会念出来）</p>
      </div>

      <div id="q-spell">
        <div class="cn" id="cn"></div>
        <p class="hint" id="hint">按中文写出英文，只敲字母就行（空格和标点会自动补）</p>
        <div class="slotwrap" id="slotwrap">
          <div class="slots" id="slots"></div>
          <input class="ghost" id="input" type="text" lang="en" inputmode="latin" autocomplete="off"
                 autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"
                 maxlength="60" aria-label="默写" />
        </div>
        <p class="hint" id="tap-hint" hidden>想改哪一格，点它一下再打字</p>
        <div class="row" id="actions"></div>
      </div>

      <div id="feedback"></div>
      <div class="streak" id="streak"></div>
    </div>

    <div class="card lv" id="card-level" hidden>
      <div class="stars" id="lv-stars"></div>
      <div class="title" id="lv-title">这一小关过完啦</div>
      <div class="sub" id="lv-sub"></div>
      <div class="row"><button class="do big" id="lv-next" type="button">继续</button></div>
    </div>

    <div class="card sum" id="card-sum" hidden>
      <div class="emoji">🎉</div>
      <div class="title" id="sum-title">今天的英语复习做完啦</div>
      <div class="list" id="sum-list"></div>
      <div class="sub goal-line" id="sum-goal" hidden></div>
      <div class="sub" id="sum-note" hidden></div>
      <div class="row">
        <button class="do big" id="again" type="button">再练一遍</button>
        <button class="sec big" id="home" type="button">回今天</button>
      </div>
    </div>

    <p class="foot">错的词明天还会再来，不用怕写错</p>
  </div>
  <script type="module" src="./game.js"></script>
</body>
</html>
