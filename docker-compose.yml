services:
  sunshine:
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:-dev}
    container_name: sunshine-workbench
    restart: unless-stopped
    ports:
      - "192.168.100.5:9000:8000"   # 绑定内网IP，供隧道机器访问
    environment:
      - SUNSHINE_DB=/data/sunshine.db
      - TZ=Asia/Shanghai
      - APP_REVISION=${APP_REVISION:-}
      - SECRET_KEY=${SECRET_KEY:-}
    volumes:
      - ./data:/data            # SQLite 持久化到宿主机 data/ 目录
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
