services:
  sunshine:
    build: .
    container_name: sunshine-workbench
    restart: unless-stopped
    ports:
      - "0.0.0.0:9000:8000"   # 监听所有接口(仅内网)，供另一台机器上的 cloudflared 经内网访问
    environment:
      - SUNSHINE_DB=/data/sunshine.db
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/data            # SQLite 持久化到宿主机 data/ 目录
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s