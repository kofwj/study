name: Build and Deploy APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'android/**'
      - 'VERSION'
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Build frontend
        run: |
          cd frontend
          echo "📦 安装依赖..."
          npm ci --verbose
          echo "🔧 确保 Rollup 原生模块正确安装..."
          npm install --no-save @rollup/rollup-linux-x64-gnu
          echo "🔨 开始构建..."
          npm run build
          echo "✅ 构建完成，检查输出..."
          ls -lh dist/
      
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
      
      - name: Check APK output
        run: |
          ls -lh android/app/build/outputs/apk/release/
          APK_SIZE=$(du -h android/app/build/outputs/apk/release/app-release.apk | cut -f1)
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          echo "✅ APK 构建成功: $APK_SIZE"
      
      - name: Get version
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT
      
      - name: Rename APK with version
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             sunshine-v${{ steps.version.outputs.VERSION }}.apk
          ls -lh sunshine-v${{ steps.version.outputs.VERSION }}.apk
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create static directory on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /home/kofwj/sunshine/static"
      
      - name: Upload APK to VPS
        run: |
          echo "📤 开始上传 APK 到 VPS..."
          ls -lh sunshine-v${{ steps.version.outputs.VERSION }}.apk
          scp -v -i ~/.ssh/id_ed25519 \
            sunshine-v${{ steps.version.outputs.VERSION }}.apk \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/kofwj/sunshine/static/sunshine-latest.apk
          echo "✅ APK 已上传到 VPS"
          echo "🔍 验证上传结果..."
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "ls -lh /home/kofwj/sunshine/static/sunshine-latest.apk"
      
      - name: Extract changelog for current version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANGELOG=$(awk "/## .*v${VERSION}/,/## .*v[0-9]/" CHANGELOG.md | sed '1d;$d')
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          body: |
            ## 🎉 阳光记账本 v${{ steps.version.outputs.VERSION }}
            
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ---
            
            ### 📦 安装方式
            
            **平板用户（推荐）**：
            1. 点击下方 Assets 中的 APK 文件下载
            2. 在平板上打开并安装
            
            **或通过 VPS 下载**：
            访问 `http://${{ secrets.VPS_HOST }}:9000/api/apk/latest`
            
            ### 📊 构建信息
            - **APK 大小**: ${{ env.APK_SIZE }}
            - **构建时间**: ${{ github.event.head_commit.timestamp }}
            - **提交**: ${{ github.sha }}
          files: |
            sunshine-v${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Deployment summary
        run: |
          echo "## 🚀 部署成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **版本**: v${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK 大小**: ${{ env.APK_SIZE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release**: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **VPS 下载**: http://${{ secrets.VPS_HOST }}:9000/api/apk/latest" >> $GITHUB_STEP_SUMMARY
          echo "- **部署时间**: $(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "平板可访问 http://${{ secrets.VPS_HOST }}:9000 检查更新" >> $GITHUB_STEP_SUMMARY
