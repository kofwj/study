name: Build and Deploy APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'android/**'
      - 'VERSION'
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Build frontend
        run: |
          cd frontend
          echo "📦 安装依赖..."
          npm ci
          echo "🔍 验证 Rollup 模块..."
          ls -la node_modules/@rollup/ 2>/dev/null || echo "@rollup 目录不存在"
          echo "🔨 开始构建..."
          npm run build
          echo "✅ 构建完成，检查输出..."
          ls -lh dist/
      
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
      
      - name: Check APK output
        run: |
          # 检查未签名的 APK（没有配置签名时的默认输出）
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            APK_FILE="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            APK_FILE="android/app/build/outputs/apk/release/app-release.apk"
          else
            echo "❌ 未找到 APK 文件"
            exit 1
          fi
          ls -lh "$APK_FILE"
          APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          echo "✅ APK 构建成功: $APK_SIZE"
      
      - name: Get version
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT
      
      - name: Rename APK with version
        run: |
          cp "$APK_FILE" sunshine-v${{ steps.version.outputs.VERSION }}.apk
          ls -lh sunshine-v${{ steps.version.outputs.VERSION }}.apk
      
      - name: Extract changelog for current version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANGELOG=$(awk "/## .*v${VERSION}/,/## .*v[0-9]/" CHANGELOG.md | sed '1d;$d')
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          body: |
            ## 🎉 阳光记账本 v${{ steps.version.outputs.VERSION }}
            
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ---
            
            ### 📦 安装方式
            
            点击下方 **Assets** 中的 APK 文件下载，在平板上打开并安装。
            
            ### 📊 构建信息
            - **APK 大小**: ${{ env.APK_SIZE }}
            - **构建时间**: ${{ github.event.head_commit.timestamp }}
            - **提交**: ${{ github.sha }}
          files: |
            sunshine-v${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Deployment summary
        run: |
          echo "## 🚀 部署成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **版本**: v${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK 大小**: ${{ env.APK_SIZE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release**: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **部署时间**: $(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
