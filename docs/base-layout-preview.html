<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>秘密基地 · 摆放预览</title>
  <style>
    :root {
      --bg: #fff6ea;
      --ink: #3b3027;
      --ink-2: #6b5d50;
      --line: #ead9c4;
      --accent: #e07a5f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-rounded, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
      padding: 20px 16px 48px;
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .lead { max-width: 820px; color: var(--ink-2); font-size: 14px; line-height: 1.6; margin: 0 0 16px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
    button, .tab {
      border: 2px solid var(--line);
      background: #fffdf8;
      border-radius: 999px;
      padding: 6px 14px;
      font: inherit;
      cursor: pointer;
    }
    .tab.on, button.pri { background: #3b3027; color: #fffdf8; border-color: #3b3027; }
    .stage-wrap {
      max-width: 920px;
      background: #1a1410;
      border-radius: 16px;
      overflow: visible;
      border: 2px solid var(--line);
      box-shadow: 0 10px 24px -16px rgba(60,40,20,.5);
    }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1448 / 543;
      user-select: none;
      touch-action: none;
    }
    .stage img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .item {
      position: absolute;
      transform: translate(-50%, -100%);
      cursor: grab;
      z-index: 2;
      overflow: visible;
    }
    .item.dragging { cursor: grabbing; z-index: 9; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
    .item img { pointer-events: none; }
    .item .tag {
      position: absolute; left: 50%; top: 100%; transform: translate(-50%, 2px);
      font-size: 11px; background: rgba(59,48,39,.88); color: #fff; padding: 1px 6px;
      border-radius: 8px; white-space: nowrap; pointer-events: none;
    }
    .item .toy, .item .stick, .item .blades {
      display: block; width: 100%; height: auto; pointer-events: none; position: relative;
    }
    .item .stick { position: absolute; inset: 0; width: 100%; z-index: 4; }
    .item .blades { position: relative; z-index: 2; }
    .sit {
      position: absolute; pointer-events: none; z-index: 4;
      filter: drop-shadow(0 1px 0 rgba(40,30,20,.45)) drop-shadow(0 3px 4px rgba(0,0,0,.28));
    }
    .item.flip .toy { transform: scaleX(-1); transform-origin: 50% 50%; }
    @keyframes spin-hub { to { transform: rotate(360deg); } }
    .item.spin-wheel .blades {
      transform-origin: 49.5% 43.3%;
      animation: spin-hub 2.8s linear infinite;
    }
    @keyframes glow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.4) drop-shadow(0 0 8px #f5d76a); }
    }
    .item.glow .toy { animation: glow 1.6s ease-in-out infinite; }
    @keyframes flutter {
      0%, 100% { transform: scaleX(1); }
      35% { transform: scaleX(0.76); }
      70% { transform: scaleX(1.06); }
    }
    .item.wave .fabric {
      transform-origin: 16% 38%;
      animation: flutter 1.7s ease-in-out infinite;
    }
    .item .pole { position: absolute; inset: 0; width: 100%; z-index: 3; pointer-events: none; }
    .item .fabric { position: relative; z-index: 2; pointer-events: none; width: 100%; display: block; }
    @keyframes bob {
      0%, 100% { transform: translate(-50%, -100%) translateY(0); }
      50% { transform: translate(-50%, -100%) translateY(-11%); }
    }
    .item.bob { animation: bob 3.2s ease-in-out infinite; }
    .item.bob.dragging, .stage.mode-toy .item.bob { animation: none; }
    .stage.mode-toy .buddy { pointer-events: none; opacity: .42; }
    .stage.mode-buddy .item { pointer-events: none; }
    .buddy {
      position: absolute; width: 8%;
      transform: translate(-50%, -100%);
      z-index: 5; cursor: grab;
    }
    .buddy.dragging { cursor: grabbing; z-index: 10; }
    .buddy img {
      width: 100%; height: auto; display: block; pointer-events: none;
      filter: drop-shadow(0 1px 0 rgba(40,30,20,.45)) drop-shadow(0 3px 4px rgba(0,0,0,.28));
    }
    .nums {
      max-width: 920px; margin-top: 14px;
      background: #fffdf8; border: 2px solid var(--line); border-radius: 14px;
      padding: 12px 14px; font-size: 13px; line-height: 1.55;
    }
    .nums code { background: #f3e6d4; padding: 0 4px; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
    .hint { color: var(--ink-2); font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>秘密基地 · 摆放预览</h1>
  <p class="lead">对着图拖玩具。数字会变。满意了把下面表格发我，我再改规格。锚点是图片<strong>底边中点</strong>。这页只给规划看，不是 App。</p>
  <div class="bar">
    <button class="tab on" data-scene="sun" type="button">天台</button>
    <button class="tab" data-scene="leaf" type="button">树屋</button>
    <button class="tab" data-scene="sky" type="button">云上</button>
    <button id="tod" type="button">夜晚</button>
    <button id="mode" class="pri" type="button">现在：拖玩具</button>
    <button id="reset" type="button">复位规格数字</button>
  </div>
  <div class="stage-wrap"><div class="stage" id="stage"></div></div>
  <div class="nums">
    <div id="live">拖一下看数字</div>
    <table id="tbl"></table>
    <p class="hint">「拖玩具」模式下：点望远镜或月亮床翻 180°。旗面沿旗杆左右飘（杆不转、不点头）。风车叶片全形转，手柄单独扣在上面不转。下面表格就是锁定坐标。</p>
  </div>

  <script>
    const BASE = {
      sun:  "./sprites/base/sun-day.png",
      sunN: "./sprites/base/sun-night.png",
      leaf: "./sprites/base/leaf-day.png",
      leafN:"./sprites/base/leaf-night.png",
      sky:  "./sprites/base/sky-day.png",
      skyN: "./sprites/base/sky-night.png",
    }
    const TOY = "./sprites/toys/"
    const SP  = "./sprites/"
    /* 锁定稿：与 ROADMAP_STAGE2.md §4.7.6 同一套数字，未再拖动前不要改 */
    const SPEC = {
      sun: [
        { id: "sun-rocket", name: "火箭", x: 13, y: 86, w: 22, sit: {x:58,y:70,w:18,ax:50,ay:42}, pose: "sit", sp: "sp-sun" },
        { id: "sun-telescope", name: "望远镜", x: 46, y: 99, w: 16, flip: true },
        { id: "trace-pinwheel", name: "风车", x: 95, y: 70, w: 12, anim: "spin-wheel" },
      ],
      leaf: [
        { id: "leaf-hammock", name: "吊床", x: 82, y: 115, w: 28, sit: {x:50,y:52,w:20,ax:50,ay:55}, pose: "lie", sp: "sp-leaf" },
        { id: "leaf-jars", name: "萤火虫瓶", x: 20, y: 34, w: 11, anim: "glow" },
        { id: "memo-award", name: "奖状", x: 45, y: 43, w: 10 },
        { id: "memo-flag", name: "小旗", x: 11, y: 87, w: 10, anim: "wave" },
      ],
      sky: [
        { id: "sky-balloon", name: "热气球", x: 19, y: 56, w: 18, sit: {x:50,y:92,w:16,ax:50,ay:28}, pose: "sit", sp: "sp-rain", anim: "bob" },
        { id: "sky-moonbed", name: "月亮床", x: 75, y: 82, w: 22, sit: {x:50,y:72,w:20,ax:50,ay:48}, pose: "lie", sp: "sp-moon", flip: true },
      ],
    }
    const BUDDY0 = {
      sun: [
        { sp: "sp-sun", name: "暖暖", x: 16, y: 80, w: 6 },
        { sp: "sp-dusk", name: "霞霞", x: 52, y: 90, w: 8 },
        { sp: "sp-seed", name: "籽籽", x: 66, y: 90, w: 8 },
        { sp: "sp-iris", name: "虹虹", x: 78, y: 90, w: 8 },
      ],
      leaf: [
        { sp: "sp-leaf", name: "叶叶", x: 22, y: 56, w: 7 },
        { sp: "sp-moss", name: "苔苔", x: 30, y: 92, w: 8 },
        { sp: "sp-chime", name: "铃铃", x: 42, y: 92, w: 8 },
        { sp: "sp-fruit", name: "果果", x: 72, y: 92, w: 8 },
      ],
      sky: [
        { sp: "sp-rain", name: "滴滴", x: 32, y: 86, w: 5 },
        { sp: "sp-moon", name: "弯弯", x: 78, y: 74, w: 7, nightOnly: true },
        { sp: "sp-iris", name: "虹虹", x: 38, y: 86, w: 8 },
        { sp: "sp-star", name: "闪闪", x: 50, y: 86, w: 8 },
        { sp: "sp-seed", name: "籽籽", x: 62, y: 86, w: 8 },
      ],
    }
    let scene = "sun", night = false
    let layout = JSON.parse(JSON.stringify(SPEC))
    let buddies = JSON.parse(JSON.stringify(BUDDY0))

    const stage = document.getElementById("stage")
    let dragMode = "toy"
    stage.classList.add("mode-toy")
    document.getElementById("mode").onclick = () => {
      dragMode = dragMode === "toy" ? "buddy" : "toy"
      stage.classList.toggle("mode-toy", dragMode === "toy")
      stage.classList.toggle("mode-buddy", dragMode === "buddy")
      document.getElementById("mode").textContent = dragMode === "toy" ? "现在：拖玩具" : "现在：拖形象"
    }
    function srcOf(id) {
      if (id.startsWith("sp-")) return SP + id + ".png"
      return TOY + id + ".png"
    }
    function render() {
      const bg = night ? BASE[scene+"N"] : BASE[scene]
      stage.innerHTML = `<img class="bg" alt="" src="${bg}">`
      for (const it of layout[scene]) {
        const el = document.createElement("div")
        el.className = "item" + (it.flipped ? " flip" : "") + (it.anim ? " " + it.anim : "")
        el.dataset.id = it.id
        el.style.left = it.x + "%"
        el.style.top = it.y + "%"
        el.style.width = it.w + "%"
        if (it.id === "trace-pinwheel") {
          el.innerHTML = `<img class="stick" src="${TOY}trace-pinwheel-stick.png" alt=""><img class="blades" src="${TOY}trace-pinwheel-blades.png" alt=""><span class="tag">${it.name} ${it.x},${it.y} w${it.w}</span>`
        } else if (it.id === "memo-flag") {
          el.innerHTML = `<img class="pole" src="${TOY}memo-flag-pole.png" alt=""><img class="fabric" src="${TOY}memo-flag-fabric.png" alt=""><span class="tag">${it.name} ${it.x},${it.y} w${it.w}</span>`
        } else {
          el.innerHTML = `<img class="toy" src="${srcOf(it.id)}" alt="${it.name}"><span class="tag">${it.name} ${it.x},${it.y} w${it.w}</span>`
        }
        stage.appendChild(el)
      }
      buddies[scene].forEach((b, i) => {
        if (b.nightOnly && !night) return
        const el = document.createElement("div")
        el.className = "buddy"
        el.dataset.i = String(i)
        el.style.left = b.x + "%"
        el.style.top = b.y + "%"
        el.style.width = b.w + "%"
        el.innerHTML = `<img src="${srcOf(b.sp)}" alt="${b.name}">`
        stage.appendChild(el)
      })
      table()
    }
    function table() {
      const rows = layout[scene].map(it =>
        `<tr><td>${it.name}</td><td><code>${it.id}</code></td><td>${it.x}</td><td>${it.y}</td><td>${it.w}</td></tr>`
      ).join("")
      document.getElementById("tbl").innerHTML =
        `<tr><th>名字</th><th>id</th><th>x</th><th>y</th><th>w</th></tr>${rows}`
      document.getElementById("live").textContent =
        (night ? "夜晚 · " : "白天 · ") + ({sun:"天台",leaf:"树屋",sky:"云上"}[scene])
    }
    let drag = null
    stage.addEventListener("pointerdown", e => {
      const r = stage.getBoundingClientRect()
      const buddy = e.target.closest(".buddy")
      if (buddy) {
        const b = buddies[scene][+buddy.dataset.i]
        drag = { kind: "buddy", el: buddy, b, x0: e.clientX, y0: e.clientY, sx: b.x, sy: b.y, r }
        buddy.classList.add("dragging")
        buddy.setPointerCapture(e.pointerId)
        return
      }
      const el = e.target.closest(".item")
      if (!el) return
      const it = layout[scene].find(x => x.id === el.dataset.id)
      drag = { kind: "toy", el, it, shift: e.shiftKey, x0: e.clientX, y0: e.clientY, sx: it.x, sy: it.y, sw: it.w, r, moved: false }
      el.classList.add("dragging")
      el.setPointerCapture(e.pointerId)
    })
    stage.addEventListener("pointermove", e => {
      if (!drag) return
      const dx = (e.clientX - drag.x0) / drag.r.width * 100
      const dy = (e.clientY - drag.y0) / drag.r.height * 100
      if (drag.kind === "buddy") {
        drag.b.x = Math.max(4, Math.min(96, Math.round(drag.sx + dx)))
        drag.b.y = Math.max(8, Math.min(98, Math.round(drag.sy + dy)))
        drag.el.style.left = drag.b.x + "%"
        drag.el.style.top = drag.b.y + "%"
        return
      }
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 6) drag.moved = true
      if (drag.shift) {
        drag.it.w = Math.max(6, Math.min(50, Math.round(drag.sw + dx)))
      } else {
        drag.it.x = Math.max(0, Math.min(100, Math.round(drag.sx + dx)))
        drag.it.y = Math.max(0, Math.min(118, Math.round(drag.sy + dy)))
      }
      drag.el.style.left = drag.it.x + "%"
      drag.el.style.top = drag.it.y + "%"
      drag.el.style.width = drag.it.w + "%"
      const tag = drag.el.querySelector(".tag")
      if (tag) tag.textContent = `${drag.it.name} ${drag.it.x},${drag.it.y} w${drag.it.w}`
      table()
    })
    stage.addEventListener("pointerup", () => {
      if (drag) {
        drag.el.classList.remove("dragging")
        if (drag.kind === "toy" && !drag.moved && drag.it.flip) {
          drag.it.flipped = !drag.it.flipped
          drag.el.classList.toggle("flip", drag.it.flipped)
        }
      }
      drag = null
    })
    document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
      document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b))
      scene = b.dataset.scene
      render()
    })
    document.getElementById("tod").onclick = () => { night = !night; document.getElementById("tod").textContent = night ? "白天" : "夜晚"; render() }
    document.getElementById("reset").onclick = () => {
      layout = JSON.parse(JSON.stringify(SPEC))
      buddies = JSON.parse(JSON.stringify(BUDDY0))
      render()
    }
    render()
  </script>
</body>
</html>
